<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fosslink — Interactive home automation demo</title><meta name="description" content="Explore Fosslink: a hands-on smart home demo with personalized device controls, scenes and energy insights."><link rel="icon" href="favicon.svg"><link rel="preload" href="favicon.svg" as="image"><style>
html[data-startup]{background:#242930;color:#f0f2f5}
html[data-startup-theme="light"]{background:#dce1e6;color:#202a35}
#startup-screen{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;background:#242930;color:#f0f2f5;font-family:Inter,system-ui,sans-serif;transition:opacity .28s ease;isolation:isolate}
html[data-startup-theme="light"] #startup-screen{background:#dce1e6;color:#202a35}
html[data-startup] body{margin:0;overflow:hidden}
html[data-startup] body>:not(#startup-screen):not(script):not(noscript){visibility:hidden}
.startup-lockup{display:flex;flex-direction:column;align-items:center;gap:18px;animation:startup-in .3s ease-out both}
.startup-lockup img{width:96px;height:96px;display:block}
.startup-lockup strong{font-size:28px;letter-spacing:-1px;font-weight:600}
.startup-status{position:absolute;top:calc(50% + 120px);display:flex;align-items:center;flex-direction:column;gap:14px;text-align:center;padding:0 24px;font-size:12px;color:inherit;opacity:.75;line-height:1.6}
.startup-spinner{width:20px;height:20px;box-sizing:border-box;border:2px solid currentColor;border-right-color:transparent;border-bottom-color:transparent;border-radius:50%;animation:startup-spin 1s linear infinite;opacity:.7}
.startup-footer{position:absolute;bottom:max(40px,env(safe-area-inset-bottom));font-size:12px;letter-spacing:.3px;opacity:.65}
#startup-retry{border:1px solid currentColor;border-radius:10px;background:transparent;color:inherit;font:inherit;padding:10px 18px;cursor:pointer}
#startup-screen.startup-exit{opacity:0;pointer-events:none}
@keyframes startup-spin{to{transform:rotate(360deg)}}
@keyframes startup-in{from{opacity:0}to{opacity:1}}
@media(max-height:500px){.startup-lockup img{width:64px;height:64px}.startup-lockup{gap:10px;transform:translateY(-35px)}.startup-lockup strong{font-size:24px}.startup-status{top:calc(50% + 40px)}.startup-footer{bottom:16px}}
@media(prefers-reduced-motion:reduce){#startup-screen,.startup-lockup,.startup-spinner{animation:none;transition:none}}
</style>
<script>
(()=>{
const root=document.documentElement;
root.setAttribute('data-startup','');
try{root.dataset.startupTheme=localStorage.getItem('fosslink-theme')==='light'?'light':'dark'}catch{root.dataset.startupTheme='dark'}
const started=performance.now();let finished=false,timeout;
window.fosslinkStartup={ready(){
if(finished)return;finished=true;clearTimeout(timeout);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
setTimeout(()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{
const screen=document.getElementById('startup-screen'),app=document.getElementById('app');
root.removeAttribute('data-startup');app.removeAttribute('inert');app.setAttribute('aria-busy','false');
screen.classList.add('startup-exit');setTimeout(()=>{screen.remove();root.removeAttribute('data-startup-theme')},reduced?0:300);
})),Math.max(0,(reduced?0:650)-(performance.now()-started)));
}};
timeout=setTimeout(()=>{if(finished)return;const status=document.getElementById('startup-message'),retry=document.getElementById('startup-retry');if(status)status.textContent='Fosslink is taking longer to start. Please try reloading.';if(retry)retry.hidden=false},10000);
document.addEventListener('click',e=>{if(e.target.id==='startup-retry')location.reload()});
})();
</script>
<link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="entities.css"><link rel="stylesheet" href="layout-glass.css"><link rel="stylesheet" href="editor.css"><link rel="stylesheet" href="navigation.css"><link rel="stylesheet" href="energy.css"><link rel="stylesheet" href="energy-polish.css"><link rel="stylesheet" href="energy-mobile.css"><link rel="stylesheet" href="system.css"><link rel="stylesheet" href="scenes.css"></head><body><div id="startup-screen" role="status" aria-live="polite" aria-label="Loading Fosslink"><div class="startup-lockup"><img src="favicon.svg" alt="" width="96" height="96" fetchpriority="high"><strong>Fosslink</strong></div><div class="startup-status"><span class="startup-spinner" aria-hidden="true"></span><span id="startup-message">Starting your home</span><button id="startup-retry" hidden>Reload Fosslink</button></div><div class="startup-footer">Your home. Connected.</div></div><noscript><style>.startup-spinner{display:none}#startup-message{display:none}</style><p style="position:fixed;z-index:10001;bottom:90px;width:100%;text-align:center">Enable JavaScript to use the Fosslink demo.</p></noscript><div id="app" inert aria-busy="true"></div><dialog id="modal"></dialog><div id="toast" role="status"></div><script defer src="inventory.js"></script><script defer src="app.js"></script><script defer src="energy.js"></script><script defer src="system.js"></script><script defer src="scenes.js"></script><script defer src="navigation.js"></script><script defer src="editor.js"></script><script defer src="device-layout.js"></script><script defer src="startup.js"></script></body></html>
